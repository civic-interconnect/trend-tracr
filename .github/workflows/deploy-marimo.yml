name: Deploy Marimo App

# REQ: Set GH Repo Settings / Pages / Deployment to GitHub Actions.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: A1) Checkout repository code
        uses: actions/checkout@v7

      - name: A2) Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: A3) Install project Python
        run: uv python install

      - name: A4) Install dependencies from committed lockfile
        run: uv sync --frozen

      - name: B0) Prepare public data
        run: |
          mkdir -p src/public
          cp data/raw/TraCR_v1_database.csv src/public/TraCR_v1_database.csv
          cp data/processed/all-geocodes-v2020.csv src/public/all-geocodes-v2020.csv
          cp data/processed/TraCR_Metadata_Column_Metadata.csv src/public/TraCR_Metadata_Column_Metadata.csv

      - name: B1) Export Marimo app
        run: |
          uv run marimo export html-wasm src/app.py \
            -o _site \
            --mode run

      - name: B2) Disable Jekyll
        run: touch _site/.nojekyll

      - name: C1) Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: C2) Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages # ignore any editor warnings
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: D1) Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
